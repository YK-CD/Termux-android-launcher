name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Extrair projeto
        run: |
          if [ -f TermuxLauncher.zip ]; then
            unzip -q -o TermuxLauncher.zip -d _proj
          fi
          echo "== arquivos Gradle encontrados =="
          find . -maxdepth 4 \( -name 'settings.gradle*' -o -name 'gradlew' \) -not -path './.git/*'
          SETTINGS=$(find . -maxdepth 4 -name 'settings.gradle*' -not -path './.git/*' | head -n1)
          if [ -z "$SETTINGS" ]; then
            echo "ERRO: settings.gradle(.kts) nao encontrado. Estrutura:"
            find . -maxdepth 3 -not -path './.git/*' | head -80
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK (manual)
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          curl -sL -o /tmp/cmdtools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d $HOME/android-sdk/cmdline-tools
          mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest

          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH

          SDKM=$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "platform-tools" "platforms;android-34" "platforms;android-35" "build-tools;34.0.0"

      - name: Set up Gradle (caso nao exista gradlew)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f gradlew ] && [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TermuxLauncher-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: warn
